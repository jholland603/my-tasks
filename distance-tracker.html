<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DIST TRKR</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23141416'/><circle cx='8' cy='24' r='4' fill='%2300e5ff'/><circle cx='24' cy='8' r='4' fill='%2339ff14'/><line x1='8' y1='24' x2='24' y2='8' stroke='%23444' stroke-width='1.5' stroke-dasharray='3,2'/><circle cx='8' cy='24' r='2' fill='%23141416'/><circle cx='24' cy='8' r='2' fill='%23141416'/></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #141416;
  --panel:   #1c1c1f;
  --border:  rgba(255,255,255,0.07);
  --accent:  #00e5ff;
  --red:     #ff3d71;
  --green:   #39ff14;
  --dim:     #555;
  --mid:     #888;
  --text:    #e8e8e8;
  --sans:    'DM Sans', sans-serif;
  --mono:    'DM Mono', monospace;
  --display: 'Syne', sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

/* ── APP SHELL ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
}

/* ── SCREENS ── */
.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}
.screen.active { display: flex; }

/* ── TOP BAR ── */
.top-bar {
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.app-title {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--text);
}

.live-pill {
  display: none;
  align-items: center;
  gap: 5px;
  background: rgba(57,255,20,0.1);
  border: 1px solid rgba(57,255,20,0.25);
  border-radius: 20px;
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--green);
}
.live-pill.visible { display: flex; }

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: blink 1s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

/* ── HERO ── */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 0 20px;
  min-height: 0;
}

.hero-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.04);
  pointer-events: none;
}

.distance-number {
  font-family: var(--display);
  font-size: 88px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -4px;
  color: var(--text);
  transition: color 0.4s, text-shadow 0.4s;
  position: relative;
  z-index: 1;
}
.distance-number.live {
  color: var(--green);
  text-shadow: 0 0 60px rgba(57,255,20,0.2);
}
.distance-number.zero { color: #2a2a2e; }

.unit-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  position: relative;
  z-index: 1;
}
.unit-chip {
  padding: 5px 16px;
  border-radius: 20px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--dim);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.unit-chip.active {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.2);
  color: var(--text);
}

.hero-status {
  margin-top: 10px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--dim);
  text-align: center;
  min-height: 18px;
  position: relative;
  z-index: 1;
  transition: color 0.3s;
  padding: 0 20px;
}
.hero-status.live-state { color: var(--green); }
.hero-status.error-state { color: var(--red); }
.hero-status.ok-state { color: var(--mid); }

/* ── POINT CARDS ── */
.points-section {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

.point-card {
  background: var(--panel);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  transition: border-color 0.3s;
}
.point-card.set-a { border-color: rgba(0,229,255,0.25); }
.point-card.set-b { border-color: rgba(57,255,20,0.2); }

.point-btn {
  border-radius: 12px;
  padding: 10px 14px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  border: none;
  cursor: pointer;
  min-width: 106px;
  text-align: center;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.point-btn:active { transform: scale(0.96); }
.point-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

.btn-a         { background: var(--accent); color: #000; }
.btn-a:hover:not(:disabled) { background: #33eaff; }
.btn-a-done    { background: rgba(0,229,255,0.1); color: var(--accent); border: 1.5px solid rgba(0,229,255,0.3); }
.btn-a-loading { background: #ffbe00; color: #000; animation: blink 0.7s infinite; }
.btn-b         { background: transparent; color: var(--green); border: 1.5px solid rgba(57,255,20,0.5); }
.btn-b:hover:not(:disabled) { background: rgba(57,255,20,0.08); }
.btn-b-loading { background: rgba(57,255,20,0.1); color: #ffbe00; border: 1.5px solid #ffbe00; animation: blink 0.7s infinite; }
.btn-b-done    { background: rgba(57,255,20,0.1); color: var(--green); border: 1.5px solid rgba(57,255,20,0.3); }

.point-info { flex: 1; min-width: 0; }
.point-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  color: var(--dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.point-coords {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.point-coords.set-a { color: var(--accent); }
.point-coords.set-b { color: var(--green); }
.point-acc {
  font-family: var(--mono);
  font-size: 10px;
  color: #3a3a3e;
  margin-top: 2px;
}
.point-acc.visible { color: var(--dim); }

/* ── RESET ── */
.reset-row {
  display: flex;
  justify-content: center;
  padding: 0 12px 10px;
  flex-shrink: 0;
}
.reset-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 8px 24px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--dim);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.reset-btn:hover { border-color: var(--red); color: var(--red); }

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.07);
  background: rgba(20,20,22,0.98);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 14px;
  cursor: pointer;
  gap: 4px;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s;
}
.tab:active { opacity: 0.7; }
.tab-icon { font-size: 22px; opacity: 0.3; transition: opacity 0.2s; }
.tab-icon.active { opacity: 1; }
.tab-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  color: var(--dim);
  transition: color 0.2s;
}
.tab-label.active { color: var(--text); }

/* ── AD BANNER ── */
.ad-banner {
  height: 40px;
  background: #111113;
  border-top: 1px solid rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-shrink: 0;
}
.ad-tag {
  font-family: var(--sans);
  font-size: 9px;
  color: #2a2a2e;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: 1px solid #222;
  border-radius: 3px;
  padding: 1px 4px;
}
.ad-text {
  font-family: var(--sans);
  font-size: 11px;
  color: #333;
}

/* ── LOG SCREEN ── */
.log-top-bar {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.log-title {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
}
.export-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 7px 14px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--mid);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.export-btn:hover { border-color: var(--accent); color: var(--accent); }

.log-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.log-list::-webkit-scrollbar { width: 3px; }
.log-list::-webkit-scrollbar-track { background: transparent; }
.log-list::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 2px; }

.log-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--dim);
  letter-spacing: 0.5px;
}

/* log item with swipe-delete */
.log-item-wrap {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  flex-shrink: 0;
}
.log-item-delete-bg {
  position: absolute;
  inset: 0;
  background: var(--red);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
  border-radius: 16px;
}
.log-item-delete-bg span {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  color: #fff;
}

.log-item {
  background: var(--panel);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  cursor: pointer;
  position: relative;
  transform: translateX(0);
  transition: transform 0.2s ease;
  will-change: transform;
  user-select: none;
  -webkit-user-select: none;
}
.log-item.swiped { transform: translateX(-80px); }

.log-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  min-width: 22px;
}
.log-info { flex: 1; min-width: 0; }
.log-name {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.log-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
}
.log-dist-wrap { text-align: right; }
.log-dist {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.log-dist-unit {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--dim);
  text-align: right;
}
.log-chevron { color: #333; font-size: 16px; margin-left: 2px; }

.swipe-hint {
  text-align: center;
  font-family: var(--sans);
  font-size: 10px;
  color: #222;
  padding: 6px 0 4px;
  letter-spacing: 1px;
}

/* ── DETAIL SCREEN ── */
.detail-top-bar {
  padding: 14px 20px 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.back-btn {
  font-size: 24px;
  color: var(--accent);
  cursor: pointer;
  padding: 0 4px;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}
.detail-name {
  flex: 1;
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rename-btn {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  background: none;
  border: none;
  padding: 4px 0;
}

.detail-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px 14px;
  flex-shrink: 0;
}
.detail-dist {
  font-family: var(--display);
  font-size: 68px;
  font-weight: 800;
  letter-spacing: -3px;
  line-height: 1;
  color: var(--text);
}
.detail-unit {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--dim);
  margin-top: 4px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.detail-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  margin-top: 6px;
}

.detail-cards {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.detail-card {
  background: var(--panel);
  border-radius: 14px;
  padding: 14px 18px;
  border: 1px solid var(--border);
}
.detail-card-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  color: var(--dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
}
.detail-key { font-family: var(--sans); font-size: 13px; color: var(--mid); }
.detail-val { font-family: var(--mono); font-size: 12px; color: var(--text); }

.elev-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.elev-arrow { font-size: 14px; }
.elev-val { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.elev-label { font-family: var(--sans); font-size: 11px; color: var(--dim); }
.elev-up .elev-arrow, .elev-up .elev-val { color: var(--red); }
.elev-down .elev-arrow, .elev-down .elev-val { color: var(--green); }
.elev-flat .elev-arrow, .elev-flat .elev-val { color: var(--dim); }
</style>
</head>
<body>
<div class="app">

  <!-- ══ MEASURE SCREEN ══ -->
  <div class="screen active" id="screenMeasure">
    <div class="top-bar">
      <div class="app-title">DIST TRKR</div>
      <div class="live-pill" id="livePill">
        <div class="live-dot"></div>LIVE
      </div>
    </div>

    <div class="hero">
      <div class="hero-ring" style="width:220px;height:220px;"></div>
      <div class="hero-ring" style="width:160px;height:160px;"></div>
      <div class="distance-number zero" id="distNum">0</div>
      <div class="unit-row">
        <button class="unit-chip active" id="chipYd" onclick="setUnit('yd')">YD</button>
        <button class="unit-chip"        id="chipMi" onclick="setUnit('mi')">MI</button>
      </div>
      <div class="hero-status" id="heroStatus">Tap Set Point A to begin</div>
    </div>

    <div class="points-section">
      <div class="point-card" id="cardA">
        <button class="point-btn btn-a" id="btnA" onclick="setPointA()">Set Point A</button>
        <div class="point-info">
          <div class="point-label">Starting Point</div>
          <div class="point-coords" id="aCoords">—</div>
          <div class="point-acc" id="aAcc"></div>
        </div>
      </div>
      <div class="point-card" id="cardB">
        <button class="point-btn btn-b" id="btnB" onclick="setPointB()" disabled>Set Point B</button>
        <div class="point-info">
          <div class="point-label">Destination</div>
          <div class="point-coords" id="bCoords">Move and tap to lock</div>
          <div class="point-acc" id="bAcc"></div>
        </div>
      </div>
    </div>

    <div class="reset-row">
      <button class="reset-btn" onclick="resetAll()">↺ Reset</button>
    </div>
  </div>

  <!-- ══ LOG SCREEN ══ -->
  <div class="screen" id="screenLog">
    <div class="log-top-bar">
      <div class="log-title">Log</div>
      <button class="export-btn" onclick="exportJSON()">Export JSON ↓</button>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty" id="logEmpty">No measurements yet</div>
    </div>
    <div class="swipe-hint">← Swipe to delete &nbsp;·&nbsp; Tap to view</div>
  </div>

  <!-- ══ DETAIL SCREEN ══ -->
  <div class="screen" id="screenDetail">
    <div class="detail-top-bar">
      <div class="back-btn" onclick="goBack()">‹</div>
      <div class="detail-name" id="detailName"></div>
      <button class="rename-btn" onclick="renameCurrent()">Rename</button>
    </div>
    <div class="detail-hero">
      <div class="detail-dist" id="detailDist"></div>
      <div class="detail-unit" id="detailUnit"></div>
      <div class="detail-date" id="detailDate"></div>
    </div>
    <div class="detail-cards" id="detailCards"></div>
  </div>

  <!-- ══ TAB BAR ══ -->
  <div class="tab-bar">
    <div class="tab" id="tabMeasure" onclick="switchTab('measure')">
      <div class="tab-icon active" id="iconMeasure">⊙</div>
      <div class="tab-label active" id="labelMeasure">Measure</div>
    </div>
    <div class="tab" id="tabLog" onclick="switchTab('log')">
      <div class="tab-icon" id="iconLog">≡</div>
      <div class="tab-label" id="labelLog">Log</div>
    </div>
  </div>

  <div class="ad-banner">
    <span class="ad-tag">Ad</span>
    <span class="ad-text">Your ad here — unobtrusive, always</span>
  </div>

</div>

<script>
// ── STATE ──────────────────────────────────────────────────
let pointA      = null;
let unit        = 'yd';
let measurements = [];
let measureCount = 0;
let liveWatchId  = null;
let currentDetailId = null;
let prevTab     = 'measure';
let touchStartX = 0;
let touchStartY = 0;

const unitLabels   = { yd: 'Yards', mi: 'Miles' };
const unitDecimals = { yd: 1, mi: 3 };

// ── UTILS ──────────────────────────────────────────────────
function metersTo(m, u) {
  return u === 'mi' ? m / 1609.344 : m / 0.9144;
}
function fmt(m) {
  return metersTo(m, unit).toFixed(unitDecimals[unit]);
}
function haversine(la1, lo1, la2, lo2) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLa = r(la2-la1), dLo = r(lo2-lo1);
  const a = Math.sin(dLa/2)**2 + Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── UNIT TOGGLE ────────────────────────────────────────────
function setUnit(u) {
  unit = u;
  document.getElementById('chipYd').classList.toggle('active', u === 'yd');
  document.getElementById('chipMi').classList.toggle('active', u === 'mi');
  if (measurements.length > 0) {
    const last = measurements[measurements.length-1].meters;
    setDistDisplay(last, liveWatchId !== null);
  }
}

function setDistDisplay(meters, isLive) {
  const el = document.getElementById('distNum');
  el.textContent = fmt(meters);
  el.classList.remove('zero','live');
  if (isLive) el.classList.add('live');
}

// ── STATUS ─────────────────────────────────────────────────
function setStatus(msg, state) {
  const el = document.getElementById('heroStatus');
  el.textContent = msg;
  el.className = 'hero-status';
  if (state) el.classList.add(state + '-state');
}

// ── GPS AVERAGING ──────────────────────────────────────────
const MIN_SAMPLES  = 5;
const MAX_ACCURACY = 15;
const SAMPLE_WINDOW = 8000;

function acquirePosition(onSuccess, onError) {
  const samples = [];
  let watchId = null, timer = null, done = false;

  function finish() {
    if (done) return;
    done = true;
    navigator.geolocation.clearWatch(watchId);
    clearTimeout(timer);
    if (!samples.length) { onError({code:2}); return; }
    const lat = samples.reduce((s,p)=>s+p.lat,0)/samples.length;
    const lon = samples.reduce((s,p)=>s+p.lon,0)/samples.length;
    const alts = samples.filter(p=>p.alt!==null).map(p=>p.alt);
    const alt = alts.length ? alts.reduce((s,a)=>s+a,0)/alts.length : null;
    const acc = samples.reduce((s,p)=>s+p.acc,0)/samples.length;
    onSuccess({lat,lon,alt,acc,n:samples.length});
  }

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const acc = pos.coords.accuracy;
      if (acc <= MAX_ACCURACY) {
        samples.push({lat:pos.coords.latitude,lon:pos.coords.longitude,alt:pos.coords.altitude,acc});
        setStatus('Collecting… ' + samples.length + '/' + MIN_SAMPLES + ' (±' + Math.round(acc*3.28084) + ' ft)', 'live');
      } else {
        setStatus('Waiting for signal… ±' + Math.round(acc*3.28084) + ' ft', null);
      }
      if (samples.length >= MIN_SAMPLES) finish();
    },
    err => { if (!done) { done=true; clearTimeout(timer); onError(err); } },
    {enableHighAccuracy:true, timeout:30000, maximumAge:0}
  );
  timer = setTimeout(() => { if (!done) finish(); }, SAMPLE_WINDOW);
}

// ── LIVE TRACKING ──────────────────────────────────────────
function startLive() {
  if (!navigator.geolocation) return;
  stopLive();
  document.getElementById('livePill').classList.add('visible');
  liveWatchId = navigator.geolocation.watchPosition(
    pos => {
      if (!pointA) return;
      const d = haversine(pointA.lat, pointA.lon, pos.coords.latitude, pos.coords.longitude);
      setDistDisplay(d, true);
      setStatus('Updating live — tap Set Point B to lock', 'live');
    },
    ()=>{},
    {enableHighAccuracy:true, maximumAge:2000}
  );
}

function stopLive() {
  if (liveWatchId !== null) { navigator.geolocation.clearWatch(liveWatchId); liveWatchId = null; }
  document.getElementById('livePill').classList.remove('visible');
  document.getElementById('distNum').classList.remove('live');
}

// ── SET POINT A ────────────────────────────────────────────
function setPointA() {
  if (!navigator.geolocation) { setStatus('GPS not supported in this browser', 'error'); return; }
  stopLive();

  const btn = document.getElementById('btnA');
  btn.textContent = 'Locating…';
  btn.className = 'point-btn btn-a-loading';
  btn.disabled = true;
  document.getElementById('btnB').disabled = true;
  setStatus('Waiting for GPS signal…', null);

  acquirePosition(
    pos => {
      pointA = pos;
      document.getElementById('aCoords').textContent = pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5);
      document.getElementById('aCoords').className = 'point-coords set-a';
      const accEl = document.getElementById('aAcc');
      accEl.textContent = '±' + Math.round(pos.acc*3.28084) + ' ft · ' + pos.n + ' samples';
      accEl.className = 'point-acc visible';
      document.getElementById('cardA').className = 'point-card set-a';
      btn.textContent = 'Point A ✓';
      btn.className = 'point-btn btn-a-done';
      btn.disabled = false;
      document.getElementById('btnB').disabled = false;
      setStatus('Point A set — move to Point B', 'ok');
      startLive();
    },
    err => {
      btn.textContent = 'Set Point A';
      btn.className = 'point-btn btn-a';
      btn.disabled = false;
      const msgs = {1:'Location permission denied',2:'Position unavailable — try outdoors',3:'GPS timed out — tap to retry'};
      setStatus(msgs[err.code]||'GPS error — try again', 'error');
    }
  );
}

// ── SET POINT B ────────────────────────────────────────────
function setPointB() {
  if (!pointA || !navigator.geolocation) return;
  stopLive();

  const btn = document.getElementById('btnB');
  btn.textContent = 'Locating…';
  btn.className = 'point-btn btn-b-loading';
  btn.disabled = true;
  setStatus('Locking Point B…', null);

  acquirePosition(
    pos => {
      document.getElementById('bCoords').textContent = pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5);
      document.getElementById('bCoords').className = 'point-coords set-b';
      const accEl = document.getElementById('bAcc');
      accEl.textContent = '±' + Math.round(pos.acc*3.28084) + ' ft · ' + pos.n + ' samples';
      accEl.className = 'point-acc visible';
      document.getElementById('cardB').className = 'point-card set-b';

      const meters = haversine(pointA.lat, pointA.lon, pos.lat, pos.lon);
      setDistDisplay(meters, false);

      // Elevation change
      let elevNote = '';
      if (pointA.alt !== null && pos.alt !== null) {
        const df = ((pos.alt - pointA.alt) * 3.28084).toFixed(0);
        elevNote = (df > 0 ? ' ▲ +' : df < 0 ? ' ▼ ' : ' — ') + df + ' ft elev';
      }

      measureCount++;
      const now  = new Date();
      const time = now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const date = now.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
      const name = 'Measurement ' + measureCount;
      const entry = {id:measureCount, name, meters, pointA:{...pointA}, pointB:{...pos}, time, date};
      measurements.push(entry);
      saveToStorage();
      addLogRow(entry);

      btn.textContent = 'Set Point B';
      btn.className = 'point-btn btn-b';
      btn.disabled = false;
      setStatus(fmt(meters) + ' ' + unitLabels[unit].toLowerCase() + elevNote, 'ok');

      // restart live from same Point A
      startLive();
    },
    err => {
      btn.textContent = 'Set Point B';
      btn.className = 'point-btn btn-b';
      btn.disabled = false;
      const msgs = {1:'Permission denied',2:'Position unavailable',3:'Timed out — tap retry'};
      setStatus(msgs[err.code]||'GPS error', 'error');
      startLive();
    }
  );
}

// ── RESET ──────────────────────────────────────────────────
function resetAll() {
  if (measurements.length > 0 && !confirm('Clear all measurements and reset?')) return;
  stopLive();
  pointA = null; measurements = []; measureCount = 0;
  saveToStorage();

  const el = document.getElementById('distNum');
  el.textContent = '0'; el.className = 'distance-number zero';

  document.getElementById('btnA').textContent = 'Set Point A';
  document.getElementById('btnA').className = 'point-btn btn-a';
  document.getElementById('btnA').disabled = false;
  document.getElementById('btnB').textContent = 'Set Point B';
  document.getElementById('btnB').className = 'point-btn btn-b';
  document.getElementById('btnB').disabled = true;

  document.getElementById('aCoords').textContent = '—';
  document.getElementById('aCoords').className = 'point-coords';
  document.getElementById('aAcc').textContent = '';
  document.getElementById('aAcc').className = 'point-acc';
  document.getElementById('bCoords').textContent = 'Move and tap to lock';
  document.getElementById('bCoords').className = 'point-coords';
  document.getElementById('bAcc').textContent = '';
  document.getElementById('bAcc').className = 'point-acc';
  document.getElementById('cardA').className = 'point-card';
  document.getElementById('cardB').className = 'point-card';

  rebuildLog();
  setStatus('Tap Set Point A to begin', null);
}

// ── LOG ────────────────────────────────────────────────────
function addLogRow(entry) {
  const empty = document.getElementById('logEmpty');
  if (empty) empty.remove();

  const wrap = document.createElement('div');
  wrap.className = 'log-item-wrap';
  wrap.dataset.id = entry.id;

  const del = document.createElement('div');
  del.className = 'log-item-delete-bg';
  del.innerHTML = '<span>Delete</span>';
  del.onclick = () => deleteEntry(entry.id);

  const item = document.createElement('div');
  item.className = 'log-item';
  item.innerHTML = `
    <div class="log-num">#${String(entry.id).padStart(2,'0')}</div>
    <div class="log-info">
      <div class="log-name">${entry.name}</div>
      <div class="log-meta">${entry.date} · ${entry.time}</div>
    </div>
    <div class="log-dist-wrap">
      <div class="log-dist">${fmt(entry.meters)}</div>
      <div class="log-dist-unit">${unitLabels[unit].toLowerCase()}</div>
    </div>
    <div class="log-chevron">›</div>`;
  item.onclick = () => openDetail(entry.id);

  // swipe to reveal delete
  let tx = 0, startX = 0, startY = 0, swiping = false;
  item.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swiping = false;
  }, {passive:true});
  item.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!swiping && Math.abs(dy) > Math.abs(dx)) return;
    swiping = true;
    tx = Math.max(-80, Math.min(0, dx));
    item.style.transform = `translateX(${tx}px)`;
    item.style.transition = 'none';
  }, {passive:true});
  item.addEventListener('touchend', () => {
    item.style.transition = 'transform 0.2s ease';
    if (tx < -40) { item.style.transform = 'translateX(-80px)'; item.classList.add('swiped'); }
    else { item.style.transform = 'translateX(0)'; item.classList.remove('swiped'); }
    tx = 0;
  });

  wrap.appendChild(del);
  wrap.appendChild(item);
  const list = document.getElementById('logList');
  list.insertBefore(wrap, list.firstChild);
}

function rebuildLog() {
  const list = document.getElementById('logList');
  list.innerHTML = '';
  if (!measurements.length) {
    const e = document.createElement('div');
    e.className = 'log-empty'; e.id = 'logEmpty'; e.textContent = 'No measurements yet';
    list.appendChild(e);
    return;
  }
  [...measurements].reverse().forEach(e => addLogRow(e));
}

function deleteEntry(id) {
  if (!confirm('Delete this measurement?')) {
    // snap back
    const wrap = document.querySelector(`.log-item-wrap[data-id="${id}"]`);
    if (wrap) { const item = wrap.querySelector('.log-item'); item.style.transform='translateX(0)'; item.classList.remove('swiped'); }
    return;
  }
  measurements = measurements.filter(m => m.id !== id);
  saveToStorage();
  const wrap = document.querySelector(`.log-item-wrap[data-id="${id}"]`);
  if (wrap) wrap.remove();
  if (!measurements.length) {
    const e = document.createElement('div');
    e.className = 'log-empty'; e.id = 'logEmpty'; e.textContent = 'No measurements yet';
    document.getElementById('logList').appendChild(e);
  }
}

// ── DETAIL ────────────────────────────────────────────────
function openDetail(id) {
  const m = measurements.find(x=>x.id===id);
  if (!m) return;
  currentDetailId = id;
  prevTab = document.getElementById('screenLog').classList.contains('active') ? 'log' : 'measure';

  document.getElementById('detailName').textContent = m.name;
  document.getElementById('detailDist').textContent = fmt(m.meters);
  document.getElementById('detailUnit').textContent = unitLabels[unit];
  document.getElementById('detailDate').textContent = m.date + ' · ' + m.time;

  // Build cards
  const cards = document.getElementById('detailCards');
  const altA = m.pointA.alt !== null ? (m.pointA.alt*3.28084).toFixed(0)+' ft' : 'N/A';
  const altB = m.pointB.alt !== null ? (m.pointB.alt*3.28084).toFixed(0)+' ft' : 'N/A';

  let elevHtml = '';
  if (m.pointA.alt !== null && m.pointB.alt !== null) {
    const df = ((m.pointB.alt - m.pointA.alt)*3.28084).toFixed(0);
    const cls = df > 0 ? 'elev-up' : df < 0 ? 'elev-down' : 'elev-flat';
    const arrow = df > 0 ? '▲' : df < 0 ? '▼' : '—';
    const sign  = df > 0 ? '+' : '';
    elevHtml = `<div class="elev-row ${cls}"><span class="elev-arrow">${arrow}</span><span class="elev-val">${sign}${df} ft</span><span class="elev-label">elevation change</span></div>`;
  }

  cards.innerHTML = `
    <div class="detail-card">
      <div class="detail-card-label">Distance</div>
      <div class="detail-row"><span class="detail-key">Yards</span><span class="detail-val">${metersTo(m.meters,'yd').toFixed(1)}</span></div>
      <div class="detail-row"><span class="detail-key">Miles</span><span class="detail-val">${metersTo(m.meters,'mi').toFixed(4)}</span></div>
      <div class="detail-row"><span class="detail-key">Feet</span><span class="detail-val">${(m.meters*3.28084).toFixed(0)}</span></div>
      <div class="detail-row"><span class="detail-key">Meters</span><span class="detail-val">${m.meters.toFixed(1)}</span></div>
    </div>
    <div class="detail-card">
      <div class="detail-card-label">Point A</div>
      <div class="detail-row"><span class="detail-key">Latitude</span><span class="detail-val">${m.pointA.lat.toFixed(6)}</span></div>
      <div class="detail-row"><span class="detail-key">Longitude</span><span class="detail-val">${m.pointA.lon.toFixed(6)}</span></div>
      <div class="detail-row"><span class="detail-key">Elevation</span><span class="detail-val">${altA}</span></div>
    </div>
    <div class="detail-card">
      <div class="detail-card-label">Point B</div>
      <div class="detail-row"><span class="detail-key">Latitude</span><span class="detail-val">${m.pointB.lat.toFixed(6)}</span></div>
      <div class="detail-row"><span class="detail-key">Longitude</span><span class="detail-val">${m.pointB.lon.toFixed(6)}</span></div>
      <div class="detail-row"><span class="detail-key">Elevation</span><span class="detail-val">${altB}</span></div>
      ${elevHtml}
    </div>
    <div class="detail-card">
      <div class="detail-card-label">Accuracy</div>
      <div class="detail-row"><span class="detail-key">GPS Accuracy</span><span class="detail-val">±${Math.round(m.pointB.acc*3.28084)} ft</span></div>
      <div class="detail-row"><span class="detail-key">Samples averaged</span><span class="detail-val">${m.pointB.n}</span></div>
    </div>`;

  showScreen('detail');
}

function goBack() {
  showScreen(prevTab === 'log' ? 'log' : 'measure');
  if (prevTab === 'log') switchTab('log', true);
  else switchTab('measure', true);
}

function renameCurrent() {
  const m = measurements.find(x=>x.id===currentDetailId);
  if (!m) return;
  const n = prompt('Rename measurement:', m.name);
  if (n && n.trim()) {
    m.name = n.trim();
    document.getElementById('detailName').textContent = m.name;
    saveToStorage();
    rebuildLog();
  }
}

// ── TABS ───────────────────────────────────────────────────
function switchTab(tab, silent) {
  showScreen(tab === 'measure' ? 'measure' : 'log');
  ['measure','log'].forEach(t => {
    const active = t === tab;
    document.getElementById('icon'+capitalize(t)).classList.toggle('active', active);
    document.getElementById('label'+capitalize(t)).classList.toggle('active', active);
  });
}

function showScreen(name) {
  const map = {measure:'screenMeasure', log:'screenLog', detail:'screenDetail'};
  Object.values(map).forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(map[name]).classList.add('active');
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ── EXPORT ─────────────────────────────────────────────────
function exportJSON() {
  if (!measurements.length) { alert('No measurements to export.'); return; }
  const data = measurements.map(m => ({
    id: m.id, name: m.name, date: m.date, time: m.time,
    distance_yards:  +metersTo(m.meters,'yd').toFixed(1),
    distance_miles:  +metersTo(m.meters,'mi').toFixed(4),
    distance_feet:   +(m.meters*3.28084).toFixed(0),
    distance_meters: +m.meters.toFixed(4),
    point_a: {lat:m.pointA.lat, lon:m.pointA.lon, elevation_ft: m.pointA.alt!==null?(m.pointA.alt*3.28084).toFixed(0):null},
    point_b: {lat:m.pointB.lat, lon:m.pointB.lon, elevation_ft: m.pointB.alt!==null?(m.pointB.alt*3.28084).toFixed(0):null},
    accuracy_ft: Math.round(m.pointB.acc*3.28084),
    samples: m.pointB.n
  }));
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'disttrkr-measurements.json';
  a.click();
}

// ── STORAGE ────────────────────────────────────────────────
function saveToStorage() {
  try {
    localStorage.setItem('disttrkr_v2', JSON.stringify({measurements, measureCount}));
  } catch(e) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem('disttrkr_v2');
    if (!raw) return;
    const {measurements:m, measureCount:c} = JSON.parse(raw);
    if (!Array.isArray(m) || !m.length) return;
    measurements = m;
    measureCount = c || m.length;
    rebuildLog();
    setStatus('Loaded ' + m.length + ' saved measurement' + (m.length!==1?'s':''), 'ok');
  } catch(e) {}
}

// ── INIT ───────────────────────────────────────────────────
if (!navigator.geolocation) {
  setStatus('GPS not supported in this browser', 'error');
  document.getElementById('btnA').disabled = true;
}
loadFromStorage();
</script>
